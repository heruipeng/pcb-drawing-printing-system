[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mi-print"
version = "2.0.0"
description = "胜宏科技 MI 制程指示系统 — PCB 行业 MI 图纸自动生成"
authors = [
    {name = "Gf.zhang & LiuChuang", email = "VTG.SH Software Group"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
svg = ["svgwrite>=1.4", "cairosvg>=2.7"]
gui = ["PyQt5>=5.15"]
oracle = ["cx_Oracle>=8.3"]
mysql = ["PyMySQL>=1.0"]
excel = ["xlwt>=1.3"]
all = [
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "PyQt5>=5.15",
    "cx_Oracle>=8.3",
    "PyMySQL>=1.0",
    "xlwt>=1.3",
]

[project.scripts]
mi-print = "main:main"
mi-print-gui = "run_gui:main"

[project.urls]
Homepage = "https://github.com/heruipeng/pcb-drawing-printing-system"
